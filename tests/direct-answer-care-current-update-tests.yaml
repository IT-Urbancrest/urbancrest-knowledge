version: 1.0
purpose: Regression coverage for 0.10.1 direct-answer safety, lead-pastor identity, care routing, and Current Update subject isolation.

cases:
  - query: Do you offer pastoral care?
    expected_record: pastoral_care.overview
    expected_answer_contains:
      - Urbancrest pastors
      - Stephen Ministry
    must_not_contain:
      - should not be presented
      - primary contact for senior pastoral leadership
      - answer guidance
    expected_answer_mode: direct

  - query: Who is the pastor?
    expected_staff_key: geoff_prows
    expected_answer_contains:
      - Geoff Prows
      - Senior Pastor
    must_not_answer_generically_about_pastoral_team: true
    expected_answer_mode: direct

  - query: What is Stephen Ministry?
    expected_record: ministries.stephen_ministry.overview
    expected_link: https://urbancrest.church/get-involved/stephen-ministry
    must_not_link: https://urbancrest.church/get-involved

  - query: I'm struggling in my marriage. Can you help?
    safety_category: marriage_family
    expected_records_include:
      - pastoral_care.marriage_family
      - ministries.stephen_ministry.overview
      - ministries.stephen_ministry.request_care
    answer_must_include:
      - pastoral care
      - Stephen Ministry
    expected_links_include:
      - https://urbancrest.church/get-involved/stephen-ministry
      - https://urbancrest.churchcenter.com/people/forms/1494

  - query: Is AWANA happening this week?
    expected_subject: AWANA
    must_not_return_unrelated_current_update_subjects:
      - pickleball
    current_update_rule: Only directly targeted AWANA/Kids/Wednesday-wide exceptions may overlay the selected AWANA schedule.

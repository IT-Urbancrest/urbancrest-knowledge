tests:
  - id: pastoral-care-offer-direct
    question: Do you offer pastoral care?
    expected:
      retrieved_record_ids_include:
        - pastoral_care.overview
      answer_must_include:
        - pastoral care
        - Stephen Ministry
      answer_must_not_include:
        - Sunday Worship Services
        - Sunday at 9:30 AM

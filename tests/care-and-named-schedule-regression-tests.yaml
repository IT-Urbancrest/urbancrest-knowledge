      llm_invoked: true

  - id: awana-this-week-subject-isolation
    question: Is AWANA happening this week?
    expected:
      retrieved_record_ids_include:
        - schedule.kids.awana
      answer_must_include:
        - AWANA
      answer_must_not_include:
        - Pickleball
        - OPEN GYM Pickleball

  - id: live-event-details-link-remains-clickable
    question: What is the next pickleball event?
    expected:
      answer_must_include:
        - OPEN GYM Pickleball
      markdown_link_host_may_include:
        - urbancrest.churchcenter.com
      markdown_link_path_prefix_may_include:
        - /calendar/event/
      answer_must_not_include_plain_unlinked_label_only:
        - Event details

version: '1.0'
tests:
- name: activity availability exact spelling
  query: Does Urbancrest have pickleball?
  expected:
    record_title: OPEN GYM Pickleball
    record_type: event
    intent: activity_availability
    future_only: true
    answer_must_not_claim: permanent ministry
- name: activity availability one-character typo
  query: Does Urbancrest have pickeball?
  expected:
    record_title: OPEN GYM Pickleball
    fuzzy_max_edit_distance: 1
    minimum_token_length: 5
- name: activity spaced compound word
  query: Can I play pickle ball at Urbancrest?
  expected:
    record_title: OPEN GYM Pickleball
    activity_alias: Pickle ball
- name: next activity occurrence
  query: When is the next OPEN GYM Pickleball?
  expected:
    record_title: OPEN GYM Pickleball
    sort: sort_start_utc ascending
    result_count: 1
- name: unrelated typo safety
  query: Does Urbancrest have basket weaving?
  expected:
    must_not_match: OPEN GYM Pickleball

version: '1.3'
suite: retrieval_first_runtime
tests:
- name: regular Sunday service times
  query: What time are Sunday services?
  expected:
    required_record_ids:
    - schedule.weekly
    - about.services.times
    answer_must_include:
    - 9:30 AM
    - 11:00 AM
    action_link: plan_visit
    minimum_confidence: 95
    must_not: Use a routine dated service occurrence as the sole source.
- name: general church start time
  query: What time does church start?
  expected:
    required_record_id: schedule.weekly
    answer_must_include:
    - 9:30 AM
    - 11:00 AM
    minimum_confidence: 95
- name: specific Sunday exception handling
  query: What time are services this Sunday?
  expected:
    behavior: Use the regular schedule unless registry/events-live.yaml contains a dated exception for the requested Sunday.
- name: service times use focused knowledge
  query: What time are Sunday services?
  expected:
    required_record_id: about.services.times
    max_model_context_records: 8
    action_link: plan_visit
- name: next men's event uses date order
  query: What is your next men's ministry event?
  expected:
    record_type: event
    filter_any:
      ministries:
      - men
      audiences:
      - men
    exclude_past_using: sort_end_utc
    sort:
      field: sort_start_utc
      direction: ascending
    select: first
- name: small groups use split collection
  query: What Small Groups meet this week?
  expected:
    record_type: small_group
    source_registry: registry/small-groups-live.yaml
- name: missions leadership transition
  query: Who oversees missions?
  expected:
    required_record_id: ministries.missions.leadership
    answer_must_include:
    - searching for its next Global Missions Pastor
    - Jennifer Prows
    - Missions Administrator
    staff_key: jennifer_prows
    related_staff_keys:
    - darrel_schick
    profile_source: base44.Staff
    answer_must_not_include:
    - Jennifer Prows is the Global Missions Pastor
    - Jennifer Prows oversees all missions
- name: global missions pastor vacancy
  query: Who is the Global Missions Pastor?
  expected:
    required_record_id: ministries.missions.leadership
    leadership_status: transitional
    open_role: Global Missions Pastor
    staff_key: jennifer_prows
    answer_must_include:
    - currently searching
    - Jennifer Prows
    - Missions Administrator
- name: local missions leadership
  query: Who oversees local missions?
  expected:
    staff_key: darrel_schick
    answer_must_include:
    - Darrel Schick
    - Local Missions Strategist
- name: David Bickers preaching routing
  query: Which pastors are involved in preaching?
  expected:
    primary_staff_key: geoff_prows
    related_staff_keys:
    - david_bickers
- name: staff biography remains in Base44
  query: Tell me about Jennifer Prows.
  expected:
    staff_key: jennifer_prows
    profile_source: base44.Staff
    must_not: Invent biography or fun facts from routing metadata.
- name: published admin entry participates
  query: A question answered only by an approved admin entry
  expected:
    base44_filter:
      status: published
      approved: true
- name: unpublished admin entry excluded
  query: A question matching an unpublished admin entry
  expected:
    must_not: Use the unpublished entry.
- name: analytics do not block response
  query: Any supported question
  expected:
    log_entity: SearchQueryLog
    non_blocking: true
    unanswered_created_only_when_low_confidence: true
- name: student ministry schedule and summer pause
  query: When does Student Ministry meet?
  expected:
    required_record_id: ministries.students.schedule
    answer_must_include:
    - Sundays at 9:30 AM
    - Wednesdays at 6:30 PM
    - summer
    staff_key: tucker_howard
- name: preschool potty training
  query: Does my child need to be potty trained for preschool?
  expected:
    required_record_id: ministries.preschool.potty_training
    answer_must_include:
    - potty trained
    - three-year-old preschool class
    - no changing tables
    staff_key: sarah_coleman
- name: guest parking
  query: Where should I park when I visit?
  expected:
    required_record_id: ministries.guest_services.parking
    answer_must_include:
    - parking
    - south side
    - Worship Center
    action_link: plan_visit
- name: mens summit history
  query: What is the Men's Summit?
  expected:
    required_record_id: ministries.mens_summit
    answer_must_include:
    - '2005'
    - late January
    - 260 churches
- name: golf classic partners
  query: Who does the Urbancrest Golf Classic support?
  expected:
    required_record_id: ministries.golf_classic.partners
    answer_must_include:
    - You Turn Ministries
    - Caring Partners International
    - A Child's Hope International
- name: worship sensory friendly space
  query: Do you have a sensory-friendly worship option?
  expected:
    required_record_id: ministries.worship.sensory_friendly
    answer_must_include:
    - The Upper Room
    - quieter
    - lower-stimulation
- name: kids volunteer screening
  query: Are Kids Ministry volunteers background checked?
  expected:
    required_record_id: ministries.kids.volunteer_screening
    answer_must_include:
    - background check
    - sex offender registry
    - interview
    staff_key: sarah_coleman
- name: kids public safety boundary
  query: What are the exact lockdown hiding locations for each Kids room?
  expected:
    required_record_id: ministries.kids.safety
    answer_must_not_include:
    - bathroom stall
    - barricade
    - safe corner
    - pavilion
    behavior: Provide only public-facing safety information and do not disclose tactical security procedures.

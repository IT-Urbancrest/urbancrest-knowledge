    now: '2026-08-10T12:00:00-04:00'
    expected_record: sermons.2026_08_09
    expected_title: Becoming Real, Lasting Fruit
    expected_topic: authentic kingdom living
    expected_record_count: 1
    relative_date_behavior: previous_calendar_sunday

  - query: What did Geoff preach on June 7?
    expected_record: sermons.2026_06_07

version: '1.1'
suite: general_retrieval_regressions
last_updated: '2026-08-05'
purpose: Guard against over-filtering natural-language questions while preserving the rule that priority alone cannot make a record eligible.

tests:
- name: donut suggested donation explanation
  query: Why are donuts $1?
  expected:
    required_record_id: ministries.guest_services.refreshments
    answer_must_include:
    - suggested donation
    - $1
    - missions

- name: coffee price paraphrase
  query: How much is coffee?
  expected:
    first_record_id: ministries.guest_services.refreshments
    answer_must_include:
    - $1
    - suggested donation

- name: refreshment donation destination paraphrase
  query: Where do coffee donations go?
  expected:
    first_record_id: ministries.guest_services.refreshments
    answer_must_include:
    - missions
    must_not_select_record_types:
    - relationship
    - staff_route
    - routing
    - registry

- name: concise guest parking paraphrase
  query: Where do I park?
  expected:
    first_record_id: ministries.guest_services.parking

- name: concise online giving paraphrase
  query: How can I give?
  expected:
    first_record_id: next-steps.giving

- name: conversational livestream question
  query: Can I watch online?
  expected:
    first_record_id: ministries.worship.livestream

- name: church center lookup prefers answer article
  query: What is Church Center?
  expected:
    first_record_id: resources.church-center
    must_not_select_record_types:
    - registry
    - routing

- name: unrelated priority must not qualify
  query: What do you know about purple llamas?
  expected:
    selected_record_count: 0
    behavior: Do not select unrelated records merely because they have a priority value.

version: '1.0'
last_updated: '2026-08-03'
tests:
- name: general financial hardship
  query: I am struggling financially. Can the church help?
  expected:
    preferred_record_id: ministries.local_missions.financial_hardship
    minimum_confidence: 95
    staff_key: darrel_schick
    answer_must_include:
    - Baskets of Hope
    - gas
    - rent
    - utility
    must_not_default_to_emergency_food_box: true
- name: rent assistance
  query: Can Urbancrest help me with rent?
  expected:
    preferred_record_id: ministries.local_missions.rent_utility_assistance
    minimum_confidence: 95
    answer_must_include:
    - does not provide
    - rent
    - Baskets of Hope
- name: electric utility assistance
  query: Can the church help with my electric bill?
  expected:
    preferred_record_id: ministries.local_missions.rent_utility_assistance
    minimum_confidence: 95
    answer_must_include:
    - does not provide
    - utility
    - Baskets of Hope
- name: gas assistance
  query: Can Urbancrest help me with gas?
  expected:
    preferred_record_id: ministries.local_missions.gas_assistance
    minimum_confidence: 95
    staff_key: darrel_schick
    answer_must_include:
    - limited
    - not guaranteed
- name: generic food request remains baskets
  query: I need help with food
  expected:
    preferred_record_id: ministries.local_missions.food_assistance
    preserve_food_assistance_routing: true
- name: urgent existing food recipient remains emergency box
  query: I already receive Baskets of Hope but need food before the next distribution
  expected:
    preferred_record_id: ministries.local_missions.emergency_food_boxes
    preserve_emergency_food_routing: true

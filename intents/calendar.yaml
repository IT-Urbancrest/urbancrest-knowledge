id: intents.calendar
version: 1.1
status: active
title: Calendar and Event Retrieval
description: Date-aware retrieval rules for major, ministry, churchwide, and general events.

source_of_truth:
  registry: registry/events-live.yaml
  detail_articles: knowledge/events/generated/
  timezone: America/New_York
  authoritative_sort_field: sort_start_utc
  authoritative_end_field: sort_end_utc

routing:
  use_this_registry_for:
    - next_event
    - next_ministry_event
    - next_audience_event
    - upcoming_events
    - events_on_date
    - events_in_date_range
    - events_this_week
    - events_this_weekend
    - events_this_month
    - event_details
    - event_registration

  route_elsewhere:
    small_group_questions: registry/small-groups-live.yaml

retrieval:
  default_mode: structured_filter_then_sort
  steps:
    - Load registry/events-live.yaml before selecting a main event.
    - Determine the current date and time in America/New_York.
    - Exclude events whose sort_end_utc is earlier than the current time.
    - Apply requested ministry, audience, category, title, topic, or date-range filters.
    - Sort remaining matches by sort_start_utc in ascending order.
    - Return the first match for next or soonest.
    - Return plural results in ascending date order.
    - Open the selected knowledge_file for complete details.

ranking:
  event_priority:
    purpose: Controls inclusion and broad-event prominence.
    never: Must not override chronological order after a user's filters are applied.

  semantic_relevance:
    purpose: Identifies matching topics, ministries, audiences, and titles.
    never: Must not choose a later recurring occurrence over an earlier matching occurrence.

  chronological_order:
    field: sort_start_utc
    direction: ascending

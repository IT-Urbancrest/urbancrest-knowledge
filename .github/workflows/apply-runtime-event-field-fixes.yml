name: Apply Runtime Event Field Fixes

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply_runtime_event_field_fixes.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: urbancrest-knowledge-writes
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install index dependencies
        run: pip install -r scripts/requirements-index.txt

      - name: Apply guarded source patch
        run: python scripts/apply_runtime_event_field_fixes.py

      - name: Rebuild search index
        run: python scripts/build_search_index.py

      - name: Validate search index and fixtures
        run: python scripts/validate_search_index.py

      - name: Commit runtime event field fixes
        run: |
          git config user.name "urbancrest-knowledge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/build_search_index.py scripts/sync_registrations.py runtime/search-index.json

          if git diff --cached --quiet; then
            echo "Runtime event field fixes are already applied."
            exit 0
          fi

          git commit -m "fix: preserve live event runtime fields"
          git push

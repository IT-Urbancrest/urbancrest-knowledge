name: Sync Live Events

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

concurrency:
  group: urbancrest-knowledge-writes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            scripts/requirements-events.txt
            scripts/requirements-index.txt

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements-events.txt
          pip install -r scripts/requirements-index.txt

      - name: Validate public event link policy
        run: |
          python -m py_compile scripts/sync_events.py scripts/test_event_link_policy.py
          python scripts/test_event_link_policy.py

      - name: Generate calendar event files
        env:
          ICAL_FEED_URL: ${{ secrets.ICAL_FEED_URL }}
          PLANNING_CENTER_APP_ID: ${{ secrets.PLANNING_CENTER_APP_ID }}
          PLANNING_CENTER_SECRET: ${{ secrets.PLANNING_CENTER_SECRET }}
          PLANNING_CENTER_API_VERSION: "2026-06-22"
          EVENT_LOOKAHEAD_DAYS: "365"
          EVENT_MAX_MAIN_EVENTS: "150"
          SMALL_GROUP_MAX_SERIES: "100"
          SMALL_GROUP_MAX_OCCURRENCES: "12"
          EVENT_DEFAULT_IMAGE: ""
        run: python scripts/sync_events.py

      - name: Merge Planning Center Registrations events
        env:
          PLANNING_CENTER_APP_ID: ${{ secrets.PLANNING_CENTER_APP_ID }}
          PLANNING_CENTER_SECRET: ${{ secrets.PLANNING_CENTER_SECRET }}
          PLANNING_CENTER_REGISTRATIONS_API_VERSION: "2025-05-01"
          EVENT_LOOKAHEAD_DAYS: "365"
          EVENT_MAX_MAIN_EVENTS: "150"
          REGISTRATIONS_CATEGORY_ALLOWLIST: ""
          REGISTRATIONS_CATEGORY_DENYLIST: ""
        run: python scripts/sync_registrations.py

      - name: Rebuild knowledge search index
        run: python scripts/build_search_index.py

      - name: Finalize search index
        run: python scripts/finalize_search_index.py

      - name: Validate search index and fixtures
        run: python scripts/validate_search_index.py

      - name: Commit updated event and index data
        run: |
          git config user.name "urbancrest-events-bot"
          git config user.email "actions@users.noreply.github.com"

          git add -A -- \
            registry/events-live.yaml \
            registry/small-groups-live.yaml \
            knowledge/events \
            knowledge/small-groups \
            runtime/search-index.json

          echo "Files staged for commit:"
          git status --short

          if git diff --cached --quiet; then
            echo "No event or search-index changes detected."
            exit 0
          fi

          git commit -m "chore: sync live events and search index"
          git push

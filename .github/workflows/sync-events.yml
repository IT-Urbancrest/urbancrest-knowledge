name: Sync Live Events

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

concurrency:
  group: sync-live-events
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-events.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-events.txt

      - name: Generate live event files
        env:
          ICAL_FEED_URL: ${{ secrets.ICAL_FEED_URL }}
          EVENT_LOOKAHEAD_DAYS: "120"
          EVENT_MAX_EVENTS: "75"
        run: python scripts/sync_events.py

      - name: Commit updated event data
        run: |
          git config user.name "urbancrest-events-bot"
          git config user.email "actions@users.noreply.github.com"

          git add -A -- \
            registry/events-live.yaml \
            registry/small-groups-live.yaml \
            knowledge/events \
            knowledge/small-groups

          echo "Files staged for commit:"
          git status --short

          if git diff --cached --quiet; then
            echo "No event changes detected."
            exit 0
          fi

          git commit -m "chore: sync live events and small groups"
          git push

name: Build Knowledge Search Index

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - AI_PERSONALITY.md
      - STYLE_GUIDE.md
      - manifest.yaml
      - knowledge/**
      - registry/**
      - relationships/**
      - intents/**
      - tests/**
      - scripts/build_search_index.py
      - scripts/migrate_schedule_index_builder.py
      - scripts/validate_search_index.py
      - scripts/requirements-index.txt

permissions:
  contents: write

concurrency:
  group: urbancrest-knowledge-writes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-index.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-index.txt

      - name: Migrate schedule index compiler
        run: python scripts/migrate_schedule_index_builder.py

      - name: Build search index
        run: python scripts/build_search_index.py

      - name: Validate search index and fixtures
        run: python scripts/validate_search_index.py

      - name: Commit search index and compiler migration
        run: |
          git config user.name "urbancrest-knowledge-bot"
          git config user.email "actions@users.noreply.github.com"

          git add scripts/build_search_index.py runtime/search-index.json

          if git diff --cached --quiet; then
            echo "Search index and compiler are already current."
            exit 0
          fi

          git commit -m "chore: rebuild knowledge search index"
          git push

name: Build Knowledge Search Index

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - AI_PERSONALITY.md
      - STYLE_GUIDE.md
      - manifest.yaml
      - knowledge/**
      - registry/**
      - relationships/**
      - intents/**
      - tests/**
      - scripts/build_search_index.py
      - scripts/migrate_schedule_index_builder.py
      - scripts/validate_search_index.py
      - scripts/requirements-index.txt

permissions:
  contents: write

concurrency:
  group: urbancrest-knowledge-writes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-index.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-index.txt

      - name: Normalize schedule migration template
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/migrate_schedule_index_builder.py")
          text = path.read_text(encoding="utf-8")
          old = "NEW_FUNCTION = '''"
          new = "NEW_FUNCTION = r'''"

          if new not in text:
              if old not in text:
                  raise SystemExit("Could not find schedule migration template declaration")
              text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
              print("Converted schedule migration template to a raw string.")
          else:
              print("Schedule migration template is already a raw string.")
          PY

      - name: Migrate schedule index compiler
        run: python scripts/migrate_schedule_index_builder.py

      - name: Check Python syntax
        run: |
          python -m py_compile scripts/migrate_schedule_index_builder.py
          python -m py_compile scripts/build_search_index.py

      - name: Build search index
        run: python scripts/build_search_index.py

      - name: Validate search index and fixtures
        run: python scripts/validate_search_index.py

      - name: Commit search index
        run: |
          git config user.name "urbancrest-knowledge-bot"
          git config user.email "actions@users.noreply.github.com"

          git add scripts/migrate_schedule_index_builder.py scripts/build_search_index.py runtime/search-index.json

          if git diff --cached --quiet; then
            echo "Search index is already current."
            exit 0
          fi

          git commit -m "chore: rebuild knowledge search index"
          git push

rules:
- Return the exact staff key when one staff member is directly relevant.
- Use relationships/ministry-staff.yaml as the source of truth for canonical ministry ownership and vacancy handling.
- Use this file for staff-name aliases, staff-specific topics, and biography/profile routing.
- Use Base44 Staff for biography, fun fact, photo, phone, email, role display, active status, and card presentation.
- Do not append every staff profile to every prompt. Retrieve only the selected profile when needed.
- Do not identify Sarah Coleman as the Kids Ministry Director; she is Preschool Director and the recommended current Kids
  Ministry point person while that leadership position is vacant.
- Use Pastor plus first name for pastoral staff. Use first name for all other staff.

  description: '*********************************************************

    Please join us for Urbancrest''s 28th Annual Golf Classic!

    *********************************************************


    The Urbancrest Golf Classic is Urbancrest''s annual foursome scramble tournament, located at Heatherwoode Golf Club.


    Each year, we also raise money for a non-profit organization. We are excited to announce this year''s donation recipient: A Child''s Hope International!


    Be sure to register early to secure your spot, and visit classic.urbancrest.org ( http://classic.urbancrest.org ) for more information.


    Tournament Details:


    Location

    Heatherwoode Golf Club

    88 Heatherwoode Blvd.

    Springboro, OH 45066 ( https://www.google.com/maps/place/Heatherwoode+Golf+Club/@39.5378539,-84.2320634,15z/data=!4m2!3m1!1s0x0:0xaba6d7afa167d970?ved=2ahUKEwjAq-v17IvhAhVP1VkKHSjzA-EQ_BIwCnoECAAQCA )

    (Click or tap for directions.)


    Date/Schedule

    Friday, August 21, 2026

    8:30 AM – Check-in & Driving Range

    9:30 AM – Shotgun Start

    2:00 AM – Lunch & Awards


    Sponsorship

    Become a sponsor of the Urbancrest Golf Classic! Please visit classic.urbancrest.org ( http://classic.urbancrest.org ) to make your sponsorship selection.



  display_when: Sunday, August 2, 2026, 4 PM to 6 PM
  all_day: false
  details: "Join us as we celebrate \nLeah Busick\n and her faithful ministry at Urbancrest Church!\nAfter serving as our \nKids Ministry Director for the past 15 years\n, Leah is beginning an exciting new chapter as \nVice Principal at Lebanon Christian Schools\n. We are incredibly grateful for the countless ways she has invested in children, families, and our church, and we'd love for you to help us thank her and wish her well.\nStop by for a time of fellowship, encouragement, and celebration on \nSunday, August 2, from 4:00–6:00 PM\n in the \nUrbancrest Gymnasium\n. \nCoffee, cake, and donuts\n will be provided.\nWhether you served alongside Leah, your family was impacted by her ministry, or you'd simply like to express your appreciation, we hope you'll join us as we celebrate God's faithfulness through her years of service and pray for her as she begins this new season."

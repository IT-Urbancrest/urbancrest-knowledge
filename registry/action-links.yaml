selection_rules:
- Include one relevant action link at the end of an answer when it helps the user take a clear next step.
- For directions or church-location questions, include both Google Maps and Apple Maps from the directions_maps bundle.
- For Small Group questions, use the canonical Small Groups directory when a direct group-finding link is helpful.
- For broad serving or volunteering questions, include Get Involved and the Volunteer Interest Form.
- For service times, parking, what to expect, or first visit questions, prefer plan_visit.
- For RightNow Media questions, use the signup link for access and the Help Center for technical or account support.
- For broad social media questions, include Instagram, Facebook, and YouTube from the social_media bundle. For a question about one specific platform, use only that platform's link.
- Do not add an unrelated link merely because a link record matched one word in the question.

selection_rules:
- Include one relevant action link at the end of an answer when it helps the user take a clear next step.
- For service times, location, parking, what to expect, or first visit questions, prefer plan_visit.
- Do not add an unrelated link merely because a link record matched one word in the question.
- For serving or volunteering next-step questions, include both get_involved and serving_interest so users can explore opportunities
  and submit the official volunteer interest form.

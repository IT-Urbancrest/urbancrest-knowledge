selection_rules:
- Include one relevant action link at the end of an answer when it helps the user take a clear next step.
- For a directions intent, include every approved action link in the directions_maps bundle so the user can choose Google
  Maps or Apple Maps.
- For a directions intent, do not replace the map links with Plan Your Visit.
- For service times, parking, what to expect, or broader first-visit questions that are not primarily directions requests,
  prefer plan_visit.
- Do not add an unrelated link merely because a link record matched one word in the question.

  title: National Collection Week (OCC) Volunteer Signup
  summary: This year, Urbancrest is an official collection center for Operation Christmas Child!...
  description: 'This year, Urbancrest is an official collection center for Operation Christmas Child! We will be receiving shoeboxes from churches in our area during National Collection Week: November 17-24.


    Our church will be open to collect boxes for a couple hours each day of collection week, and we are looking for a few folks each day who can help with registration/paperwork, receiving and organizing boxes during this time. Please see our collection schedule below, and sign up to help in the time slot that fits your schedule.


    We hope you and your family/Small Group/friends will consider serving for a couple hours during National Collection Week, as many hands will make light work! Reach out to Jen with any questions at jprows@urbancrest.org.


    Urbancrest National Collection Week Schedule:

    – Monday, November 17 from 6:00-8:00 PM

    – Tuesday, November 18 from 10:00 AM-12:00 PM

    – Wednesday, November 19 from 10:00 AM-12:00 PM

    – Thursday, November 20 from 6:00-8:00 PM

    – Friday, November 21 from 5:00-7:00 PM

    – Saturday, November 22 from 10:00 AM-12:00 PM

    – Sunday, November 23 from 2:30-5:30 PM

    – Monday, November 24 from 8:00-11:00 AM


    For information on Urbancrest''s church-wide packing party on November 15, please click THIS LINK ( https://urbancrest.churchcenter.com/registrations/events/3219721 ).'

version: 1.0

# Use UID overrides when you know the Planning Center iCal UID.
uid_overrides: {}

# Title rules are applied from top to bottom. Matching is case-insensitive.
# Supported match keys:
#   title_equals
#   title_contains
#   title_regex
#
# Supported override keys:
#   event_category
#   event_priority
#   collection          # main_events, small_groups, or exclude
#   ministries
#   audiences
#   location
#   series_key         # forces Small Group occurrences into the same series
#
# Example:
#
# title_rules:
#   - title_contains: "Women's Conference"
#     event_category: major_event
#     event_priority: 100
#     collection: main_events
#     ministries: [women]
#     audiences: [women]

title_rules: []

# Small Group grouping examples:
#
# Merge occurrences even when the location changes:
#
#   - title_equals: "Young Families Small Group"
#     collection: small_groups
#     series_key: "young-families-small-group"
#
# Keep two groups separate when they share the same title and location:
#
#   - title_regex: "^Men's Small Group - Tuesday$"
#     collection: small_groups
#     series_key: "mens-small-group-tuesday"

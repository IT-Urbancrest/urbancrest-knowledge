selection_rules:
- Use canonical ministry areas for staff ownership. Specific topics such as giving, stewardship, production, IT, website,
  first visit, accessibility, and student parent communication are routing terms, not separate staff ownership relationships.
- Use primary_staff_key when a staffed area has one directly responsible staff member.
- When leadership_status is vacant or transitional, explain the status before recommending a contact.
- Use recommended_contact_staff_key for the staff card when no primary leader currently fills the role.
- Do not describe Jennifer Prows as the Global Missions Pastor.
- Do not describe Sarah Coleman as the Kids Ministry Director.
- For local missions and benevolence questions, use Darrel Schick as the primary staff contact.
- For IT, Production, Creative, Website, video, livestream, audio, lighting, and technology questions, use Matthew Kirby.
- For finance, giving, and stewardship questions, use Tanya Byrd.
- Use related_staff_keys only when the question genuinely involves their area.
- Do not select a staff contact merely because an unrelated retrieved article contains a recommended_contact_staff_key.
